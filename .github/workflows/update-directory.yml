name: Actualizar respaldo de la cartilla

on:
  schedule:
    # Todos los dias, 09:23 Argentina (12:23 UTC).
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-directory
  cancel-in-progress: false

jobs:
  update:
    # La ejecucion manual tampoco debe escribir sobre otra rama.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar la rama principal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'

      - name: Consultar Supabase y actualizar JSON
        run: node --use-system-ca cartilla/scripts/update-snapshot.mjs

      - name: Guardar solo si cambiaron los datos
        shell: bash
        run: |
          set -euo pipefail
          git add -- cartilla/data/profesionales.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cartilla."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar respaldo de profesionales"
          git push origin "HEAD:${DEFAULT_BRANCH}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
