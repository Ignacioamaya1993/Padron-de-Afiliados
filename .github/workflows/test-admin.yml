name: Verificar administracion e integracion

on:
  push:
    paths:
      - 'api/**'
      - 'build/**'
      - 'cartilla/**'
      - 'scripts/**'
      - 'server/**'
      - 'tests/**'
      - 'pages/**'
      - 'styles/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'api/**'
      - 'build/**'
      - 'cartilla/**'
      - 'scripts/**'
      - 'server/**'
      - 'tests/**'
      - 'pages/**'
      - 'styles/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar aplicaciones
        run: npm run build