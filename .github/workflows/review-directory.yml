name: Revisar diferencias con Circulo Medico

on:
  schedule:
    # Lunes, 10:41 Argentina (13:41 UTC).
    - cron: '41 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-directory
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar cartilla
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'

      - name: Verificar comparador
        run: node --test cartilla/scripts/directory-comparison.test.mjs

      - name: Comparar sin modificar datos
        run: node --use-system-ca cartilla/scripts/review-directory.mjs

      - name: Guardar informe descargable
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: revision-profesionales
          path: |
            cartilla/reports/revision-profesionales.*
            cartilla/reports/diagnostico-origen.json
          if-no-files-found: warn
          retention-days: 30
