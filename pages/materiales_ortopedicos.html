<section class="materiales-ortopedicos">

  <button id="btnNuevoMaterialOrtopedico" class="btn-nuevo">
    + Nuevo Material Ortopédico
  </button>

  <form id="formMaterialOrtopedico"
        class="form-card_materiales hidden">

    <input type="hidden" name="id" id="materialOrtopedicoId">

<div class="form-grid">

  <div class="campo">
    <label>Fecha carga</label>
    <input type="date" name="fecha_carga">
  </div>
  
<div class="campo">
  <label>Tipo</label>

  <select name="tipo_material_id"
          id="tipoMaterialOrtopedico">

    <option value="">Seleccione tipo de material</option>

  </select>
</div>

<div class="campo hidden" id="campoOtroMaterial">
  <label>Especifique el material</label>

  <input type="text"
         name="otro_material"
         id="otroMaterialInput"
         placeholder="Especifique el material">
</div>

  <!-- Número carga -->
  <div class="campo">
    <label>Número de carga</label>
    <input type="text" name="numero_carga" placeholder="Ingrese nro. de carga">
  </div>

  <!-- Fecha autorización -->
  <div class="campo">
    <label>Fecha de autorización</label>
    <input type="date" name="fecha_autorizacion">
  </div>

  <!-- Fecha compra -->
  <div class="campo">
    <label>Fecha de compra</label>
    <input type="date" name="fecha_compra">
  </div>

  <!-- Lugar compra -->
  <div class="campo">
    <label>Lugar donde se compra</label>
    <input type="text" name="lugar_compra" placeholder="Ingrese lugar de compra">
  </div>

  <!-- Fecha recepción -->
  <div class="campo">
    <label>Fecha de recepción</label>
    <input type="date" name="fecha_recepcion">
  </div>

  <!-- REINTEGRO -->
  <div class="campo">
    <label>Reintegro</label>
    <input type="number" name="reintegro" step="0.01" placeholder="Opcional">
  </div>

  <div class="campo">
    <label>Fecha reintegro</label>
    <input type="date" name="fecha_reintegro">
  </div>

  <!-- Observación -->
  <div class="form-group full-width">
    <label>Observación</label>
    <textarea name="observacion" placeholder="Ingrese observación"></textarea>
  </div>

  <!-- Adjuntos -->
  <div class="bloque-adjuntos">

    <label>Adjuntar documentos</label>

    <div id="adjuntosMaterialesContainer"
         class="adjuntos-nuevos">
    </div>

    <button type="button"
            id="btnAgregarAdjuntoMaterial">
      ➕ Agregar adjunto
    </button>

  </div>

</div>

    <div class="acciones-form">
      <button type="submit" class="btn-guardar">
        Guardar
      </button>

      <button type="button"
              id="btnCancelarMaterialOrtopedico"
              class="btn-cancelar">
        Cancelar
      </button>
    </div>

  </form>

  <!-- LISTA -->
  <div id="listaMaterialesOrtopedicos"
       class="lista-cards"></div>

  <!-- PAGINACION -->
  <div id="paginacionMaterialesOrtopedicos"
       class="paginacion"></div>

</section>
