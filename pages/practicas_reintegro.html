<section class="practicas-reintegro prx-wrapper">

  <button id="btnNuevaPracticaReintegro" class="btn-nuevo">
    + Nueva Práctica por Reintegro
  </button>

  <form id="formPracticaReintegro" class="prx-form-card hidden">

    <div class="form-grid">
      <div class="form-group">
        <label>Fecha carga</label>
        <input type="date" name="fecha_carga" required>
      </div>

      <div class="form-group">
        <label>Fecha prescripción</label>
        <input type="date" name="fecha_prescripcion" required>
      </div>

      <div class="form-group">
        <label>Fecha vencimiento</label>
        <input type="date" name="fecha_vencimiento" required>
      </div>

      <div class="form-group">
        <label>Tipo</label>
      <select name="tipo_practica_id" id="tipoPracticaSelect" required>
        <option value="">Seleccione tipo de práctica</option>
      </select>
      </div>
      <div class="form-group">
        <label>Reintegro</label>
        <input type="number" step="0.01" name="reintegro" placeholder="Opcional">
      </div>
      <div class="form-group">
        <label>Fecha reintegro</label>
        <input type="date" name="fecha_reintegro">
      </div>

    <div class="form-group full-width">
      <label>Observación</label>
      <textarea name="observacion" rows="3" placeholder="Ingrese observación"></textarea>
    </div>
    </div>

    <!-- Adjuntos -->
    <div class="bloque-adjuntos">
      <label>Adjuntar Documentos</label>
      <div id="adjuntosPracticasContainer" class="adjuntos-nuevos"></div>
      <button type="button" id="btnAgregarAdjuntoPracticaReintegro" class="prx-btn-agregar-adjunto">
        ➕ Agregar adjunto
      </button>
    </div>

    <div class="prx-acciones-form">
      <button type="submit" class="prx-btn-guardar">Guardar</button>
      <button type="button" id="btnCancelarPracticaReintegro" class="prx-btn-cancelar">
        Cancelar
      </button>
    </div>

  </form>

  <div id="listaPracticasReintegro" class="prx-lista-cards"></div>

  <!-- PAGINACION -->
  <div id="paginacionPracticasReintegro" class="paginacion"></div>

</section>
