<!-- TRASLADO AMBULANCIA -->
<section id="seccionTrasladoAmbulancia">

  <!-- BOTÓN NUEVO -->
  <button id="btnNuevoTrasladoAmbulancia" class="btn-nuevo">
    + Nuevo Traslado Ambulancia
  </button>

  <!-- FORMULARIO -->
  <form id="formTrasladoAmbulancia" class="form-card_traslado oculto">

    <input type="hidden" id="trasladoAmbulanciaId" />

    <div class="form-grid">

  <!-- Fecha carga -->
  <div class="form-group">
    <label>Fecha Carga</label>
    <input type="date" id="fechaCarga" required />
  </div>

  <!-- Lugar traslado -->
  <div class="form-group">
    <label>Lugar de Traslado</label>
    <input type="text" id="lugarTraslado" placeholder="Ingrese lugar de traslado" />
  </div>

  <!-- Reintegro -->
  <div class="form-group">
    <label>Reintegro</label>
    <input type="number" step="0.01" id="reintegroTraslado" placeholder="Opcional">
  </div>

  <div class="form-group">
    <label>Fecha Reintegro</label>
    <input type="date" id="fechaReintegroTraslado" />
  </div>

  <!-- Número factura -->
  <div class="form-group">
    <label>Número de Factura</label>
    <input type="text" id="numeroFacturaTraslado" placeholder="Ingrese nro. de factura" />
  </div>

  <!-- Fecha traslado -->
  <div class="form-group">
    <label>Fecha del Traslado</label>
    <input type="date" id="fechaTraslado" />
  </div>

  <!-- Proveedor -->
  <div class="form-group">
    <label>Proveedor</label>
    <input type="text" id="proveedorTraslado" placeholder="Ingrese proveedor" />
  </div>

  <!-- Número carga -->
  <div class="form-group">
    <label>Número de Carga</label>
    <input type="text" id="numeroCargaTraslado" placeholder="Ingrese nro. de carga" />
  </div>

  <!-- Importe -->
  <div class="form-group">
    <label>Importe</label>
    <input 
      type="number" 
      step="0.01"
      id="importeTraslado"
      placeholder="Ingrese importe" />
  </div>

  <!-- Fecha pago -->
  <div class="form-group">
    <label>Fecha de Pago</label>
    <input type="date" id="fechaPagoTraslado" />
  </div>

  <!-- Forma pago -->
  <div class="form-group">
    <label>Forma de Pago</label>
    <input type="text" id="formaPagoTraslado" placeholder="Ingrese forma de pago" />
  </div>

  <!-- Fecha envío comprobante -->
  <div class="form-group">
    <label>Fecha Envío Comprobante</label>
    <input type="date" id="fechaEnvioComprobanteTraslado" />
  </div>

  <!-- Observación -->
  <div class="form-group full-width">
    <label>Observación</label>
    <textarea id="observacionTraslado" rows="3" placeholder="Ingrese observación"></textarea>
  </div>

  <!-- Adjuntos -->
  <div class="bloque-adjuntos">
    <label>Adjuntar Documentos</label>

    <div id="adjuntosTrasladoLista" class="adjuntos-nuevos"></div>

    <button type="button" id="btnAgregarAdjuntoTraslado">
      ➕ Agregar adjunto
    </button>
  </div>

</div>

    <!-- BOTONES -->
    <div class="form-actions">
      <button type="submit" class="btn-guardar">Guardar</button>
      <button type="button" id="btnCancelarTrasladoAmbulancia" class="btn-cancelar">
        Cancelar
      </button>
    </div>

  </form>

  <!-- CONTENEDOR CARDS -->
  <div id="contenedorTrasladoAmbulancia" class="cards-grid"></div>

  <!-- PAGINACIÓN -->
  <div id="paginacionTrasladoAmbulancia" class="paginacion"></div>

</section>
